# PROJECT METADATA -----------------------------------------

[project]
name = "tortoisebot"
version = "1.0.0"
description = "TortoiseBot ROS 2 Lyrical workspace."
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "ty>=0.0.63",
    "pyyaml>=6.0.3"
]

# TOOL: TY -------------------------------------------------

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [
    "src/tortoisebot/third_party/**",
    "src/third_party/**",
    "build/**",
    "install/**",
    "log/**",
    "**/test/**",
    "**/setup.py",
]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

# TOOL: RUFF -----------------------------------------------

[tool.ruff]
target-version = "py314"
line-length = 88
src = [
    "src/tortoisebot/tortoisebot_firmware",
    "src/tortoisebot/tortoisebot_teleop",
    "src/tortoisebot/tortoisebot_intelligence",
    "src/tortoisebot/tortoisebot_bringup",
    "src/tortoisebot/tortoisebot_description",
    "src/tortoisebot/tortoisebot_gazebo",
    "src/tortoisebot/tortoisebot_slam",
    "src/tortoisebot/tortoisebot_navigation",
]
extend-exclude = [
    ".venv",
    "src/tortoisebot/third_party",
    "src/third_party",
    "build",
    "install",
    "log",
    "**/setup.py",
    "**/test/**",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "D",
    "UP",
    "PL",
    "RUF",
    "B",
    "C4",
    "PT",
    "SIM",
    "PTH",
    "TC",
    "ASYNC",
]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "D203",
    "D213",
    "E501",
    "PLR0402",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"**/*.launch.py" = ["INP001"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = [
    "tortoisebot_firmware",
    "tortoisebot_teleop",
    "tortoisebot_intelligence",
]

[tool.ruff.format]
quote-style = "double"
